<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="icBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#08182b"/>
      <stop offset="100%" stop-color="#02050d"/>
    </linearGradient>
    <linearGradient id="icAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <filter id="cyanGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="500" fill="url(#icBg)"/>

  <!-- Grid overlay -->
  <pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(0, 242, 255, 0.04)" stroke-width="1"/>
  </pattern>
  <rect width="700" height="500" fill="url(#grid2)"/>

  <!-- Computer Vision Bounding Boxes -->
  <g stroke="#00f2ff" stroke-width="1.5" fill="rgba(0, 242, 255, 0.05)">
    <!-- Box 1 -->
    <rect x="130" y="110" width="110" height="170" rx="4" stroke-dasharray="4 2"/>
    <rect x="130" y="94" width="70" height="16" fill="#00f2ff"/>
    <text x="134" y="106" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#000">PERSON 94%</text>

    <!-- Box 2 (Center) -->
    <rect x="290" y="80" width="120" height="190" rx="4" stroke="#7000ff" stroke-width="2" fill="rgba(112, 0, 255, 0.08)"/>
    <rect x="290" y="64" width="70" height="16" fill="#7000ff"/>
    <text x="294" y="76" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#fff">PERSON 98%</text>

    <!-- Box 3 -->
    <rect x="460" y="120" width="100" height="160" rx="4" stroke-dasharray="4 2"/>
    <rect x="460" y="104" width="70" height="16" fill="#00f2ff"/>
    <text x="464" y="116" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#000">PERSON 91%</text>
  </g>

  <!-- Density HUD Bar -->
  <g transform="translate(180, 310)">
    <rect x="0" y="0" width="340" height="30" rx="6" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(0, 242, 255, 0.3)" stroke-width="1"/>
    <text x="15" y="19" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">DENSITY LEVEL</text>
    <rect x="120" y="8" width="190" height="14" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="120" y="8" width="130" height="14" rx="4" fill="url(#icAccent)"/>
    <text x="318" y="19" font-family="'Inter', sans-serif" font-size="10" fill="#00f2ff" font-weight="600">MODERATE</text>
  </g>

  <!-- Typography -->
  <text x="350" y="390" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Intellicrowd</text>
  <text x="350" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#00f2ff" text-anchor="middle" letter-spacing="1.5">AI-BASED CROWD MANAGEMENT SYSTEM</text>
  <text x="350" y="445" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">YOLO &bull; Java &bull; HTML &bull; CSS &bull; JavaScript</text>
</svg>
