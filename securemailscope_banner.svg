<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="smsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0614"/>
      <stop offset="50%" stop-color="#140b2a"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff00c8"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="500" fill="url(#smsBg)"/>

  <!-- Grid overlay -->
  <pattern id="grid3" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(112, 0, 255, 0.05)" stroke-width="1"/>
  </pattern>
  <rect width="700" height="500" fill="url(#grid3)"/>

  <!-- Shield & Mail Icon -->
  <g transform="translate(350, 160)">
    <circle cx="0" cy="0" r="75" fill="rgba(112, 0, 255, 0.12)" filter="url(#purpleGlow)"/>
    <!-- Outer Shield -->
    <path d="M 0,-50 Q 45,-40 45,0 Q 45,45 0,65 Q -45,45 -45,0 Q -45,-40 0,-50 Z" fill="none" stroke="url(#purplePink)" stroke-width="2.5" filter="url(#purpleGlow)"/>
    <!-- Mail envelope inside -->
    <rect x="-24" y="-16" width="48" height="32" rx="3" fill="none" stroke="#00f2ff" stroke-width="2"/>
    <path d="M -24,-14 L 0,3 L 24,-14" fill="none" stroke="#00f2ff" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Protocol Badges -->
  <g transform="translate(140, 260)">
    <rect x="0" y="0" width="85" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(0, 242, 255, 0.25)"/>
    <text x="42" y="18" font-family="'Inter', sans-serif" font-size="11" fill="#00f2ff" font-weight="600" text-anchor="middle">SMTP</text>

    <rect x="110" y="0" width="85" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(112, 0, 255, 0.3)"/>
    <text x="152" y="18" font-family="'Inter', sans-serif" font-size="11" fill="#c084fc" font-weight="600" text-anchor="middle">IMAP</text>

    <rect x="220" y="0" width="85" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 0, 200, 0.25)"/>
    <text x="262" y="18" font-family="'Inter', sans-serif" font-size="11" fill="#f472b6" font-weight="600" text-anchor="middle">POP3</text>

    <rect x="330" y="0" width="95" height="28" rx="6" fill="rgba(0, 242, 255, 0.1)" stroke="#00f2ff"/>
    <text x="377" y="18" font-family="'Inter', sans-serif" font-size="11" fill="#00f2ff" font-weight="700" text-anchor="middle">TLS / STARTTLS</text>
  </g>

  <!-- Typography -->
  <text x="350" y="350" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">SecureMailScope</text>
  <text x="350" y="380" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle" letter-spacing="1.5">PASSIVE EMAIL NETWORK TRAFFIC &amp; FORENSIC INSPECTION</text>
  <text x="350" y="405" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">TCP Session Reassembly &bull; X.509 Certificate Chain Parsing &bull; Risk Classification</text>
</svg>
